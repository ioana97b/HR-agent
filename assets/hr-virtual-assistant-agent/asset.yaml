apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: hr-virtual-assistant-agent
  description: Conversational HR virtual assistant that answers employee HR policy questions, analyzes workforce data, predicts attrition risks, and generates personalised development recommendations using simulated HCM data.

provides:
  apis:
    - name: hr-virtual-assistant-agent
      kind: a2a
      ordId: customer.build:apiResource:hr-virtual-assistant-3ba3f.hr-virtual-assistant-agent:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
